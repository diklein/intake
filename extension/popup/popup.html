<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pre-paint popup background follows the OS theme instead of defaulting to white. -->
  <meta name="color-scheme" content="light dark" />
  <title>Intake</title>
  <!-- The stylesheet is INLINE on purpose: external CSS is render-blocking, and Chrome
       sizes the popup window from the document's first layout — a cold fetch of popup.css
       (every open right after an extension reload) left that first layout unstyled, so the
       popup flashed as a tiny white stub before snapping to 360px. Inline, the first layout
       is styled and full-size in the same instant the document exists. -->
  <style>
    /* Intake popup — quiet, monochrome, system-native. Follows the OS color scheme. */

    :root {
      --bg: #ffffff;
      --fg: #17191b;
      --muted: #5d6468;
      --border: #d9dcdf;
      --border-strong: #9aa0a5;
      --field: #f2f4f5;
      --accent: #17191b;
      --on-accent: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1e21;
        --fg: #e8eaec;
        --muted: #9aa1a7;
        --border: #33383d;
        --border-strong: #6a7176;
        --field: #24282c;
        --accent: #e8eaec;
        --on-accent: #17191b;
      }
    }

    [hidden] { display: none !important; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Root owns viewport scrolling and the pre-paint background — the popup never scrolls
       (the image grid scrolls internally), so nothing can flash in a corner on resize. */
    html {
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: var(--fg);
      background: var(--bg);
      width: 360px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ── First-run setup ────────────────────────── */

    .setup {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setup-copy {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ── Sections ───────────────────────────────── */
    /* Whitespace (#main's gap), not rules, separates the sections. */

    #main {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-top: 16px;
    }

    .section {
      padding: 0 16px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    /* Foreground ink: every input carries its label on top (no placeholders — labels
       don't vanish when you start typing). */
    .section-label {
      font-size: 13px;
      color: var(--fg);
    }

    .section > .section-label {
      display: block;
      margin-bottom: 7px;
    }

    .image-count {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Inputs ─────────────────────────────────── */

    textarea,
    .field {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      color: var(--fg);
      background: var(--field);
      border: 1px solid transparent;
      border-radius: 8px;
    }

    textarea {
      min-height: 64px;
      resize: vertical;
    }

    textarea:focus-visible,
    .field:focus-visible {
      outline: none;
      border-color: var(--border-strong);
    }

    /* ── Image grid ─────────────────────────────── */

    .image-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 174px;
      overflow-y: auto;
    }

    .image-thumb {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      background: var(--field);
    }

    .image-thumb:hover img {
      opacity: 0.85;
    }

    .image-thumb.is-selected {
      border-color: var(--fg);
    }

    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }

    /* ── Footer / buttons ───────────────────────── */

    .footer {
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, translate 0.15s, scale 0.15s;
    }

    .btn:active:not(:disabled) {
      translate: 0 1px;
      scale: 0.98;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn--primary {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn--primary:hover:not(:disabled) {
      background: color-mix(in oklab, var(--accent) 88%, var(--bg));
    }

    .btn--secondary {
      background: var(--field);
      color: var(--fg);
    }

    .btn--secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .status {
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }

    /* Empty status reserves no height — the footer's bottom padding stays tight under the
       button (matching Platinum Capture) until there's actually something to say. */
    .status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">

    <div id="setup" class="setup" hidden>
      <button id="setup-btn" class="btn btn--primary">Choose vault folder</button>
    </div>

    <div id="main">
      <section class="section">
        <label class="section-label" for="text-input">Selected text</label>
        <textarea id="text-input" rows="4"></textarea>
      </section>

      <!-- Hidden until the page actually yields images — an imageless page simply has no
           Image section, and the popup never resizes to remove it. -->
      <section class="section" id="section-image" hidden>
        <div class="section-header">
          <span class="section-label">Images</span>
          <span class="image-count" id="image-count"></span>
        </div>
        <div class="image-grid" id="image-grid"></div>
      </section>

      <section class="section">
        <label class="section-label" for="title-input">Title</label>
        <input type="text" id="title-input" class="field" />
      </section>

      <section class="section">
        <label class="section-label" for="tags-input">Tags</label>
        <input type="text" id="tags-input" class="field" />
      </section>

      <div class="footer">
        <button id="article-btn" class="btn btn--secondary" title="Save this page’s article text to your vault as clean Markdown">Capture full article</button>
        <button id="save-btn" class="btn btn--primary">Send to Obsidian</button>
        <p id="status" class="status" role="status"></p>
      </div>
    </div>

  </div>
  <!-- Classic script, bundled by esbuild — same loading behavior as Platinum Capture.
       type="module" would defer execution past first paint and fetch a 3-file import
       graph first; the bundle runs during parse. Source: popup.js + ../lib/*. -->
  <script src="../dist/popup.js"></script>
</body>
</html>
