<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intake</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <div id="setup" class="setup" hidden>
      <p class="setup-copy">Point Intake at your Obsidian vault once, and every capture writes straight into it.</p>
      <button id="setup-btn" class="btn btn--primary">Choose vault folder</button>
    </div>

    <div id="main" hidden>
      <section class="section">
        <textarea id="text-input" placeholder="Selected text, or type a note…" rows="4"></textarea>
      </section>

      <section class="section">
        <div class="section-header">
          <span class="section-label">Image</span>
          <span class="image-count" id="image-count"></span>
        </div>
        <div class="image-grid" id="image-grid">
          <p class="empty-state" id="image-empty">Loading…</p>
        </div>
      </section>

      <section class="section">
        <input type="text" id="title-input" class="field" placeholder="Title…" />
      </section>

      <section class="section">
        <input type="text" id="tags-input" class="field" placeholder="tags, comma, separated" />
      </section>

      <div class="footer">
        <button id="article-btn" class="btn btn--secondary" title="Clip the whole article as clean Markdown">Clip full article</button>
        <button id="save-btn" class="btn btn--primary">Save to vault</button>
        <p id="status" class="status" role="status"></p>
      </div>
    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
